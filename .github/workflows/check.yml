name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@d9fbe93b75c105a99632ebbd9d70901404303acd # v0.6.80
    with:
      hosted-runner: ubuntu-24.04
      timeout-minutes: 15
      python-version: '3.15.2'
      uv-version: '0.13.8'
      setup: true
    permissions:
      contents: read
