name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6bd06a55307dccfd7057c1c3260067eb8adc93a1 # v0.6.79
    with:
      hosted-runner: ubuntu-24.04
      timeout-minutes: 15
      python-version: '3.12.16'
      uv-version: '0.13.7'
      setup: true
    permissions:
      contents: read
