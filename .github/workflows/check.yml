name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@18cc86d2679f0fce863dc7752c1cb2117606ca01 # v0.6.52
    with:
      hosted-runner: ubuntu-24.04
      timeout-minutes: 15
      python-version: '3.12.16'
      uv-version: '0.13.7'
      setup: true
    permissions:
      contents: read
